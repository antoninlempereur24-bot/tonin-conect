<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tonin Connect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- En-tête principal -->
        <header class="app-header">
            <div class="header-left">
                <h1>Tonin Connect</h1>
            </div>
            <div class="header-right">
                <!-- Onglet Profil / Post de Shorts -->
                <button id="profile-tab-btn" class="profile-tab-btn" title="Mon Profil & Poster un Short">
                    <img id="user-avatar-preview" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Antonin" alt="Profil">
                    <span id="username-display">Antonin</span>
                </button>
            </div>
        </header>

        <!-- Contenu principal existant (messagerie, etc.) -->
        <main class="main-content">
            <div class="welcome-box">
                <h2>Bienvenue sur Tonin Connect</h2>
                <p>Cliquez sur le diamant en bas à droite pour ouvrir les Shorts 💎</p>
            </div>
        </main>

        <!-- Bouton Flottant Diamant (Tout en bas à droite) -->
        <button id="open-shorts-btn" class="diamond-float-btn" title="Tonin Shorts">
            💎
        </button>

        <!-- MODAL / VUE SHORTS (TikTok / YouTube Shorts Style) -->
        <div id="shorts-modal" class="shorts-modal hidden">
            <div class="shorts-header">
                <button id="close-shorts-btn" class="icon-btn"><i class="fas fa-arrow-left"></i></button>
                <h2>Tonin Shorts 💎</h2>
                <button id="open-post-modal-btn" class="icon-btn" title="Publier une vidéo"><i class="fas fa-plus-circle"></i></button>
            </div>

            <div id="shorts-container" class="shorts-container">
                <!-- Les vidéos verticales seront injectées ici -->
            </div>
        </div>

        <!-- MODAL DE PUBLICATION DE SHORT -->
        <div id="post-modal" class="popup-modal hidden">
            <div class="popup-content">
                <h3>Publier un Short</h3>
                <form id="post-short-form">
                    <div class="form-group">
                        <label for="short-url">Lien de la vidéo (MP4 ou URL directe)*</label>
                        <input type="url" id="short-url" required placeholder="https://exemple.com/video.mp4">
                    </div>
                    <div class="form-group">
                        <label for="short-title">Titre (optionnel)</label>
                        <input type="text" id="short-title" placeholder="Titre de votre vidéo...">
                    </div>
                    <div class="form-group">
                        <label for="short-desc">Description (optionnelle)</label>
                        <textarea id="short-desc" placeholder="Ajoutez une description..."></textarea>
                    </div>
                    <div class="popup-actions">
                        <button type="button" id="cancel-post-btn" class="btn-secondary">Annuler</button>
                        <button type="submit" class="btn-primary">Publier</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- MODAL COMMENTAIRES -->
        <div id="comments-modal" class="popup-modal hidden">
            <div class="popup-content comments-content">
                <div class="comments-header">
                    <h3>Commentaires</h3>
                    <button id="close-comments-btn" class="icon-btn"><i class="fas fa-times"></i></button>
                </div>
                <div id="comments-list" class="comments-list">
                    <!-- Liste des commentaires -->
                </div>
                <form id="comment-form" class="comment-form">
                    <input type="text" id="comment-input" required placeholder="Ajouter un commentaire...">
                    <button type="submit"><i class="fas fa-paper-plane"></i></button>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
